[package]
name = "speeddemon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zero-dependency shared core: arena, buffered reader, deterministic writer, thread pool, SIMD byte scan"
# D=1 — no non-stdlib dependencies. Every line here must stay std-only.

[lib]
name = "speeddemon_core"
path = "src/lib.rs"

[lints.rust]
# NOTE: `unsafe` is permitted ONLY in `arena` (returning arena-owned &str) and
# in the future SIMD module, each with a written safety argument. The
# "zero-dependency" (D=1) promise is about crates, not about `unsafe`.
# Every `unsafe` block must carry a `// SAFETY:` comment.
missing_debug_implementations = "warn"
unused_must_use = "deny"
