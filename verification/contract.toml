# Contract registry — the single source of truth for every value the
# organizer freezes on Oct 28 15:00 UTC.
#
# Every row marked DEFERRED is a value this plan cannot honestly know yet.
# The plan deliberately does NOT invent them. On Oct 28, fill them in, and
# every downstream number (K budgets, ladder targets, harness wiring) becomes
# real instead of parametric.
#
# `verification/contract.toml` is the machine-readable twin of this file and
# is what the stub binaries and the harness scripts read.

[global]
data_dir = "/data"
out_dir = "/out"
# The build is PER TRACK: `docker build --network=none -t speeddemon/$TEAM-$TRACK:$COMMIT track-$TRACK`
# with the track folder as the build context, exactly as the events page shows.
# Each image's entrypoint IS that track's binary; the organizer's run command
# still passes -e TRACK=$TRACK, which a per-track binary simply ignores.
dispatch_env = "TRACK"
# Sandbox: read-only root, no network, 1 GiB tmpfs at /tmp, dataset ro.
tmpfs = "/tmp"
tmpfs_size = "1g"
network = "none"
readonly_root = true
# 5 runs, discard highest and lowest, mean of the middle three.
runs = 5
trim = 2
# ── The frozen scoring model ───────────────────────────────────────────────
# "New formula: K = (T_ref/T)^0.50 × (M_ref/M)^0.20 × (S_ref/S)^0.15 ×
#  (D_ref/D)^0.15. The scaling axis X is gone, and its weight moved to wall
#  time." FOUR axes, and the exponents sum to exactly 1.0.
#
# There is no fifth axis and no fifth weight any more. `weight_x` is gone.
weight_t = 0.50
weight_m = 0.20
weight_s = 0.15
weight_d = 0.15
# "Memory is capped at 50×. Wall time is not." The cap applies to MEMORY only.
# T is uncapped (the harness guards against a non-finite value, which is not
# a scoring cap). S and D are capped at 1.0: they can cost you, never pay.
axis_cap = 50
time_ratio_cap = "none"
s_factor_cap = 1.0
d_factor_cap = 1.0
# "Speed score = 50 × log10(K), clamped to 0 to 100: K = 10 is half marks and
#  K = 100 is full marks." The old curve was 100*ln(K)/ln(25) with K = 25 as
# full marks; that anchor is dead.
speed_score = "50 * log10(K)"
speed_score_clamp = [0, 100]
k_half_marks = 10
k_full_marks = 100
# There are THREE gates, not four: correctness, the timeout, the sandbox.
# "The speed floor gate is gone."
gates = ["correctness", "timeout", "sandbox"]

# ── Rule changes announced before the Oct 28 freeze ────────────────────────
# Provenance: the organizers' "Changes before freeze (Oct 26)" list published
# on speeddemon.dev, which supersedes the earlier five-point channel answer.
# The consolidated impact analysis is in docs/RULE-CHANGES-oct28.md. Where the
# event page and this file disagree, the event page wins — but this is the
# record the harness and the axis measurement code against.
[rules_oct28]
# "Four tracks, A to D. Track E (Compress) is cut."
tracks = ["A", "B", "C", "D"]
# "Source size is code lines counted by scc after your language's formatter,
# across each track's folder, minus registry packages first published before
# Oct 1, 2026 by people outside the team. It covers everything in the track's
# folder at the recorded commit, which is all the build can see."
s_unit = "code_lines"
s_counter = "scc"
s_scope = "per_track_folder"
s_registry_exception_before = "2026-10-01"
# "Byte-identical copies of our published generators and references are free,
# so copying the generator in for build-time training costs nothing."
s_free_verbatim_generator_copies = true
# "Source size and dependencies are capped at 1.0: they can cost you but
# never pay."
s_factor_cap = 1.0
# "D = 1 + the number of direct non-stdlib runtime dependencies declared in
# your manifest. The vendored-bytes term is gone."
d_formula = "1 + direct_non_stdlib_runtime_dependencies"
d_vendored_bytes_term = "REMOVED"
d_counts = "direct_dependencies_in_manifest"
# "Track B is timed as one total wall time, and its queries are readable from
# the start. The 40/60 build/query split is gone."
b_blend = "REMOVED"
b_timed_as = "one_total_wall_time"
# "Every FROM must name an image from speeddemon.dev/allowlist.json, pinned
# by digest, and nothing else may enter the image: no COPY --from another
# image, no ADD of a URL."
base_image_allowlist_url = "https://speeddemon.dev/allowlist.json"
base_image_must_be_digest_pinned = true
base_image_must_be_allowlisted = true
image_may_use_foreign_copy_from = false
image_may_add_url = false
image_may_use_syntax_directive = false
image_may_use_cache_secret_ssh_mounts = false
# "Builds stay offline and are capped at 10 minutes and images at 2 GB."
build_time_cap_s = 600
image_size_cap_mb = 2048
# "Build-time training (PGO, a JVM AOT cache, native-image) is allowed on
# generator output. /data is not mounted at build time, and a byte-identical
# copy of our generator in your repo costs nothing in source size."
training_runs_allowed = true
data_mounted_at_build = false
image_may_ship_cached_outputs = false
# "The scoring machine is in Falkenstein (fsn1) ... a Hetzner dedicated
# server ... Intel Core i5-13500 ... 6 P-cores @ 4.80 GHz, 8 E-cores @ 3.50
# GHz ... Debian 13 (trixie) ... Docker, cgroups v2 ... turbo off ...
# --cpuset-cpus=0-11"
scoring_machine = "fsn1 (Hetzner dedicated, Falkenstein, Germany)"
scoring_cpu = "Intel Core i5-13500"
scoring_cores = 6
scoring_threads = 12
scoring_cpuset = "0-11"
scoring_turbo = false
# "One naive Python reference per track, instead of Go, Python and Rust."
reference_language = "Python"
# "Ties on the final total are broken by raw K, then by wall time, then by
# earliest submission commit."
tie_break = ["raw_K", "wall_time", "earliest_commit"]
# Unchanged, restated so nobody "corrects" it later: T is end-to-end wall time
# from exec to exit, so startup and JIT warmup count. M is the kernel's peak
# counter for the run; untouched reservations do not count.
t_is_end_to_end = true
m_is_kernel_peak = true
# "The overall title is the geometric mean of your best three track totals,
# from three or more tracks entered."
overall_aggregate = "geometric_mean_of_best_three"
overall_min_tracks = 3

