# Scale facts that change the plan at full size.
board_dataset_scale        = "full"   # seed 1, every track
b_full_documents           = 250000   # vs 1000 tiny / 25000 sample
b_full_queries             = 50000    # 31000 BOOL / 19000 PHRASE
b_full_docs_bytes          = 253827587
b_full_reference_peak_mb   = 2290.0   # the organizers' own M4 measurement, for context
final_timeout_a_s          = 320.5
final_timeout_b_s          = 563.5
final_timeout_c_s          = 144.4
final_timeout_d_s          = 726.9

# The live board caps a run at 3x the reference; final scoring at 10x.
board_time_cap_multiplier = 3
final_time_cap_multiplier = 10

# ── Owner clarifications (official Discord answers, Oct 27) ─────────────────
# M counter: cgroup v2 memory.peak, read on the HOST after the container
# exits — NOT ru_maxrss. M is the peak of everything charged to the run's own
# cgroup: process allocations, /tmp tmpfs writes, AND any page the process is
# first to pull into the page cache (e.g. the output file). /data does NOT
# count: it is pre-warmed with vmtouch on the host before the container
# starts, so those file pages are charged outside our cgroup.
m_counter = "cgroup v2 memory.peak, read on the host after exit (not ru_maxrss) — owner-confirmed"
m_charged = "process allocations + /tmp tmpfs writes + any page our process first pulls into the page cache (output file pages count)"
m_data_pages_charged = false
m_output_pages_charged = true
# D axis: the count of direct non-stdlib runtime dependencies, whatever the
# library does (an effects DSL counts like any other). One dep = 0.90 factor
# on the score; writing it yourself moves it to S (capped at 1.0, can only
# cost). There is therefore no reason to pull in thread-pool or parser crates.
d_counts_every_direct_library = true
d_one_dep_factor = 0.90

# ── Track A — Ingest ───────────────────────────────────────────────────────
[A]
board_cap_s = 96.1

status = "DEFERRED"
# "Reference numbers are now measured on the scoring machine, five runs each:
#  Track A 32.05 s, B 56.35 s, C 14.44 s, D 72.69 s. Timeouts are 10 times
#  those." The old estimates (41.20 / 58.70 / 36.90 / 72.40) are dead.
ref_time_s = 32.047276  # official calibration seed 1 (harness/calibration-seed1.json)
ref_peak_mem_mb = 227.98336  # official cgroup memory.peak
# S is CODE LINES now, and the reference's is published: 56 lines.
ref_source_lines = 56  # official harness/reference_axes.json (code lines, prose/data free)
timeout_s = 320.5  # 10x the reference
# FILENAME: the spec fixes the dataset filenames; only the schema is public.
input_file = "requests.log"
output_file = "summary.txt"
# Output contract — RESOLVED from the published reference (starter template,
# read Oct 27): group (UTC hour, endpoint); p50/p95/p99 NEAREST RANK with
# rank = ceil(p*n/100) = (p*n+99)//100; errors = count of 5xx + ppm =
# errs*1_000_000//count (integer floor); sorted by (hour, endpoint), endpoint
# bytewise; single-space separator; trailing newline on every line; hour
# rendered "%Y-%m-%dT%H:00:00Z"; method ignored.
group_key = "endpoint per hour bucket (reference)"
percentiles = "p50/p95/p99 nearest-rank (reference: rank=(p*n+99)//100)"
error_class = "status 5xx (reference)"
sort_order = "(UTC hour, endpoint) bytewise (reference)"
percentile_rule = "nearest-rank ceil(p*n/100) (reference)"
error_rate_format = "errs count + ppm=errs*1000000//count (reference)"
field_separator = "single space (reference)"
trailing_newline = "yes, one per line (reference)"
hour_format = "%Y-%m-%dT%H:00:00Z (reference)"
input_format = "ts method endpoint status latency_us, one per line, LF (reference)"

# ── Track B — Index ───────────────────────────────────────────────────────
[B]
board_cap_s = 169.1

status = "DEFERRED"
ref_time_s = 56.352376  # official calibration seed 1 (harness/calibration-seed1.json)
# "Track B is timed as one total wall time, and its queries are readable from
# the start. The 40/60 build/query split is gone." There is no blend any
# more: build + queries are one measured wall time.
ref_total_time_s = 56.352376
ref_build_time_s = "NOT_APPLICABLE"
ref_query_time_s = "NOT_APPLICABLE"
ref_peak_mem_mb = 2199.9616  # official cgroup memory.peak
ref_source_lines = 91  # official harness/reference_axes.json (code lines, prose/data free)
timeout_s = 563.5  # 10x the reference
corpus_file = "docs.txt"
queries_file = "queries.txt"     # published name: QUERIES.TXT
output_file = "results.txt"
# The build/query blend is GONE. The formula used to be a 40/60 weighted
# blend of two ratios; it is now a single wall time for the whole program.
blend_formula = "REMOVED"
# Events page (fetch Oct 27): queries are READABLE UP FRONT ("the queries are
# readable from the start, and the task is to answer these 50,000") — plan the
# index around them. Mix: 62% BOOL, 38% PHRASE "..." (adjacent tokens, exact
# order, stopwords retained). Corpus ~256 MB / 50,000 queries.
# Boolean semantics — RESOLVED from the reference: left-associative, applied
# left to right as set ops AND=intersection, OR=union, NOT=set difference;
# no precedence, no parentheses. PHRASE = docs containing every term, then an
# exact adjacency scan of the re-tokenized text (no positions kept).
boolean_associativity = "left"
boolean_precedence = "left-to-right set ops AND/OR/NOT (reference)"
tokenizer = "maximal runs of ASCII [a-z0-9] after ASCII-lowercasing; bytes >= 0x80 are separators (reference)"
stopwords_indexed = true
result_format = "per query line: count sum up-to-10-smallest-ids, space-joined; empty -> '0 0' (reference)"
corpus_format = "docs.txt: id<TAB>text, ids 0..N-1 in order (reference)"

# ── Track C — Join ────────────────────────────────────────────────────────
[C]
board_cap_s = 43.3

status = "DEFERRED"
ref_time_s = 14.444059  # official calibration seed 1 (harness/calibration-seed1.json)
ref_peak_mem_mb = 367.435776  # official cgroup memory.peak
ref_source_lines = 108  # official harness/reference_axes.json (code lines, prose/data free)
timeout_s = 144.4  # 10x the reference
records_file = "records.csv"     # published name: RECORDS.CSV
lookup_file = "regions.csv"      # region_id,country header (reference)
output_file = "aggregates.txt"
# Events page (fetch Oct 27): 5 fixed columns WITH a header row
# (id,name,note,region_id,amount), 3.32M records, "emit sorted aggregates".
# Quoting — RESOLVED from the reference (Python csv, excel dialect):
# comma separator, double-quote quoting, "" escape, QUOTE_MINIMAL; both CRLF
# and LF terminate records; CR/LF inside quoted fields kept verbatim; U+FEFF
# stripped from the start of the FIRST FIELD of every record (file start or
# after a terminator; the first field is never quoted). Amounts are exactly
# 2 decimals, regex (-?)([0-9]+)\.([0-9]{2}) — no rounding. Aggregation per
# country via the regions join (unknown region -> "_UNMATCHED"): count,
# id_sum, amount_sum, amount_min, amount_max, distinct names, name bytes
# (utf-8), note bytes (utf-8); sorted by country (code-point = UTF-8 byte
# order); space-joined; one line per country + trailing newline.
quoting = "python csv excel dialect: comma, double-quote, \"\" escape (reference)"
bom_handling = "U+FEFF stripped from the first field of every record (reference)"
newline_in_quotes = "kept verbatim (reference)"
amount_scale = "exactly 2 decimals, regex (-?)([0-9]+)\\.([0-9]{2}) (reference)"
amount_rounding = "none (amounts are already 2dp) (reference)"
aggregate_key = "country via regions.csv join; unknown -> _UNMATCHED (reference)"
sort_order = "by country string, code-point order (reference)"
output_number_format = "space-joined: key count id_sum amount_sum amount_min amount_max distinct_names name_bytes note_bytes (reference)"

# ── Track D — Traverse ────────────────────────────────────────────────────
[D]
board_cap_s = 218.1

status = "DEFERRED"
ref_time_s = 72.692655  # official calibration seed 1 (harness/calibration-seed1.json)
ref_peak_mem_mb = 892.915712  # official cgroup memory.peak
ref_source_lines = 43  # official harness/reference_axes.json (code lines, prose/data free)
timeout_s = 726.9  # 10x the reference
graph_file = "graph.txt"         # published name: GRAPH.TXT
queries_file = "queries.txt"     # 's t' per line (reference)
output_file = "distances.txt"
# Output contract — RESOLVED from the reference: DISTANCE-ONLY, one integer
# per query line, in query order; unreachable prints -1; s == t is 0; weights
# are u32 (0 allowed); distances are unbounded in the reference (Python int)
# so the implementation must carry u64 internally; a per-query Dijkstra with
# early exit at the target.
output_contract = "distance-only, one line per query (reference)"
unreachable_spelling = "-1 (reference)"
weights_are = "uint32"
max_distance_bound = "unbounded in the reference — carry u64 internally (reference)"
# Events page (fetch Oct 27): graph is 92 MB / 5M edges. Queries are LOCAL and
# drawn at a BOUNDED search distance — "fast parsing, a compact layout and a
# lean search loop decide this track"; "Contraction hierarchies are legal, but
# this query mix rarely repays them" → parsing + CSR layout + lean bidirectional
# search are the L3 plan; heavy preprocessing is explicitly deprioritized.

# ── Track E — Compress — CUT ──────────────────────────────────────────────
# "Four tracks, A to D. Track E (Compress) is cut: storing the input raw
# outscored a real codec." The [E] section and the old E folder are gone.
#
# Keeping the scaffold would not be free: S counts every line in the repo, so
# a dead track would cost all four remaining tracks 15%-weight source size.
# It is deleted, not parked.
#
# (The whole [E] section — the compressed-size M axis, the segment geometry,
# the time blend — is gone with it. The harness no longer knows what an E
# track is.)
