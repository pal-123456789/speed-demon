[workspace]
members = [
    "core",
    "tracks/A-ingest",
    "tracks/B-index",
    "tracks/C-join",
    "tracks/D-traverse",
    "tracks/E-compress",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Speed Demon Solo"]
license = "MIT"
repository = "https://github.com/placeholder/speed-demon-campaign"
rust-version = "1.86"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
